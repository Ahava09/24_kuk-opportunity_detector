<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test OCR</title>
</head>
<body>
    <h1>Uploader un fichier</h1>
    <form method="post" action="/ocr" enctype="multipart/form-data">
        <input type="file" name="file" required><br><br>
        <label for="method">Méthode OCR :</label>
        <select name="method" id="method">
            <option value="tesseract">Tesseract (local)</option>
            <option value="ocrspace">OCR.Space (API gratuite)</option>
            <option value="vision_mock">Simulation Vision API</option>
        </select><br><br>
        <input type="submit" value="Lancer OCR">
    </form>

    {% if text %}
        <h2>Texte extrait :</h2>
        <pre>{{ text }}</pre>
    {% endif %}
</body>
</html>
