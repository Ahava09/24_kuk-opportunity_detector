<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Emails</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>

    <div class="container">
        <h2>🔐 Connexion</h2>
        <div class="form-container">
            <input type="email" id="email" placeholder="Adresse e-mail" value="minoraherinirina72@gmail.com" required autocomplete="off">
            <input type="password" id="password" placeholder="Mot de passe" value="okow yfdx plks owob" required autocomplete="off">
            <button id="loginButton">📩 Se connecter</button>
        </div>

        <!-- Loader -->
        <div id="loading" class="loader"></div>
    </div>

    <script>
        document.getElementById("loginButton").addEventListener("click", function () {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const loading = document.getElementById("loading");
            const loginButton = document.getElementById("loginButton");

            if (email && password) {
                // Afficher le loader et désactiver le bouton
                loading.style.display = "block";
                loginButton.disabled = true;

                // Envoyer les identifiants au serveur
                fetch("/get_emails", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        alert("Erreur : " + data.error);
                        loading.style.display = "none";
                        loginButton.disabled = false;
                    } else {
                        // Stocker les emails dans localStorage pour le dashboard
                        localStorage.setItem("emails", JSON.stringify(data.emails));
                        localStorage.setItem("unread_count", data.unread_count);

                        // Rediriger vers le dashboard
                        window.location.href = "/email";
                    }
                })
                .catch(error => {
                    alert("Erreur de connexion au serveur.");
                    console.error("Erreur :", error);
                    loading.style.display = "none";
                    loginButton.disabled = false;
                });
            } else {
                alert("Veuillez remplir tous les champs.");
            }
        });
    </script>

</body>
</html>
